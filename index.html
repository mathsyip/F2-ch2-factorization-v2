        }

</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const T = (lang, zh, en) => lang === 'zh' ? zh : en;
        
        const IconCheck = () => <svg className="w-4 h-4 text-emerald-500 inline-block flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>;
        const IconCross = () => <svg className="w-4 h-4 text-rose-500 inline-block flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12" /></svg>;
        const IconRefresh = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
        const IconLightbulb = () => <svg className="w-4 h-4 text-amber-500 inline-block mr-1 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14H8a4 4 0 01-3.496-5.961C5.163 6.828 6.5 5.5 8.25 5.5h3.5c1.75 0 3.087 1.328 3.746 2.539A4 4 0 0112 14z" /></svg>;
        const IconMenu = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>;
        const IconArrowRight = () => <svg className="w-4 h-4 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;
        
        const getLessonSyllabus = (lang) => [
            { id: "LO", title: T(lang, "LO 重溫多項式加減乘除", "L0 Revision: Polynomial Operations"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "鞏固同類項合併、同底數相乘及多項式展開基本功。", "Consolidate basics.") },
            { id: "L1", title: T(lang, "L1 2.1 證明恆等式", "L1 2.1 Proving Identities"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "學習比較左方與右方證明恆等式。", "Learn to prove identities.") },
            { id: "L2_L3", title: T(lang, "L2-L3 2.1 恆等式求未知常數 A, B", "L2-L3 2.1 Finding Unknowns A, B in Identities"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "嚴格依照 7 步展開左方及右方，透過比較同類項求未知常數。", "7-step expansion and comparing like terms.") },
            { id: "L4", title: T(lang, "L4 2.2 a² - b² 平方差展開", "L4 2.2 a² - b² Difference of Two Squares"), category: T(lang, "展開公式", "Expansion Formulas"), desc: T(lang, "掌握平方差展開法。", "Master difference of two squares.") },
            { id: "L5", title: T(lang, "L5 2.2 (a±b)² 完全平方展開", "L5 2.2 (a±b)² Perfect Square Expansion"), category: T(lang, "展開公式", "Expansion Formulas"), desc: T(lang, "運用完全平方公式展開。", "Use perfect square formula.") },
            { id: "L6_L1", title: T(lang, "Ch2.3 L1 因式分解 - 抽公因數/項", "Ch2.3 L1 Factorization - Common Factor"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "尋找數值與字母的最大公因式 (HCF) 並進行提取。", "Find and extract HCF.") },
            { id: "L2_BRACKET", title: T(lang, "Ch2.3 L2 因式分解 - 抽公因括號", "Ch2.3 L2 Factorization - Common Bracket"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "識別多項式中的共同括號項並提取。", "Identify and extract common bracket terms.") },
            { id: "L3_GROUPING", title: T(lang, "Ch2.3 L3 因式分解 - 併項法 (4項)", "Ch2.3 L3 Factorization - Grouping (4 terms)"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "把四項式分為兩兩一組抽公因式。", "Group 4 terms into pairs.") },
            { id: "L4_REVIEW", title: T(lang, "Ch2.3 L4 綜合重溫 - 短除法抽項", "Ch2.3 L4 Review - Short Division"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "綜合提取多項式的最大公因數與公因式 (HCF)。", "Comprehensive HCF extraction.") },
            { id: "L5_DIFF_SQ", title: T(lang, "Ch2.3 L5 因式分解 - 平方差 a² - b²", "Ch2.3 L5 Factorization - a² - b²"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "將多項式寫成 ( )² - ( )² 後分解。", "Factorize to (a + b)(a - b).") },
            { id: "L6_PERF_SQ", title: T(lang, "Ch2.3 L6 因式分解 - 完全平方 (3式)", "Ch2.3 L6 Factorization - Perfect Square (3 terms)"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "化為 (a ± b)²。", "Check if trinomial fits structure.") },
            { id: "L7_MIXED3", title: T(lang, "Ch2.3 L7 因式分解 - 溫習三式", "Ch2.3 L7 Factorization - Mixed 3 types"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "靈活運用抽公因式、平方差及完全平方進行徹底分解。", "Flexibly apply formulas.") },
            { id: "L8_STRUCT", title: T(lang, "Ch2.3 L8 因式分解大集合 - (a)(b)連貫題", "Ch2.3 L8 Factorization - (a)(b) Structural"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "解答公開試常見 (a) (b) 連貫題。", "Solve common exam structural questions.") },
            { id: "L9_DIFF_EX", title: T(lang, "Ch2.3 L9 區分因式分解與展開 & 級測", "Ch2.3 L9 Distinguish Expand & Factorize"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "精準分辨「展開」與「因式分解」。", "Distinguish Expand vs Factorize.") }
        ];
        
        const COPRIME_PAIRS = [[2,3], [2,5], [3,4], [3,5], [3,7], [3,8], [4,5], [4,7], [4,9], [5,6], [5,7], [5,8], [5,9], [7,8], [7,9], [8,9]];
        
        const generateQuestionBank = (lang) => {
            const LESSON_SYLLABUS = getLessonSyllabus(lang);
            const list = [];
            let qId = 1;
            const prng = (seed) => { let x = Math.sin(seed) * 10000; return x - Math.floor(x); };
            const getInt = (seed, offset, min, max) => min + Math.floor(prng(seed + offset) * (max - min + 1));
            const getChoice = (seed, offset, arr) => arr[Math.floor(prng(seed + offset) * arr.length)];
            const makeDistractors = (correct, f1, f2, f3, seedOffset) => {
                const set = new Set([correct, f1, f2, f3]);
                const arr = Array.from(set);
                let counter = 1;
                while(arr.length < 4) { arr.push(correct + ' '.repeat(counter)); counter++; }
                return arr.sort(() => prng(seedOffset + qId) - 0.5);
            };
            const formatTerm = (coef, variable, isFirst = false) => {
                if (coef === 0) return "";
                const sign = coef > 0 ? (isFirst ? "" : "+ ") : (isFirst ? "-" : "- ");
                const absCoef = Math.abs(coef);
                const numStr = (absCoef === 1 && variable !== "") ? "" : absCoef;
                return `${sign}${numStr}${variable}`;
            };
            
            LESSON_SYLLABUS.forEach((lesson, lIdx) => {
                for (let i = 1; i <= 30; i++) {
                    const seed = lIdx * 10000 + i * 100;
                    let qData = {};
                    const swap = prng(seed) > 0.5;
                    const hintMsg = `<br/><span class="text-indigo-600 font-bold mt-1 inline-block">💡 ${T(lang, '提示：(A)(B) 與 (B)(A) 因式乘積完全相同。', 'Note: (A)(B) and (B)(A) factors are identical.')}</span>`;
                    
                    if (lesson.id === "LO") {
                        const a = getInt(seed,1, 2, 7);
                        const b = getInt(seed,2, 1, 9);
                        const c = getInt(seed,3, 2, 5);
                        const d = getInt(seed,4, 1, 4);
                        const e = getInt(seed,5, 1, 8);
                        const rawExpr = `${a}(x + ${b}) - ${c}(${d===1?'':d}x - ${e})`;
                        const step1Corr = `${a}x + ${a*b} - ${c*d}x + ${c*e}`;
                        const finalAns = `${formatTerm(a - c*d, 'x', true)} ${formatTerm(a*b + c*e, '', false)}`.trim();
                        qData = {
                            rawExpr: rawExpr,
                            title: `${T(lang, '化簡多項式：', 'Simplify polynomial: ')}<span class="katex-mock">${rawExpr}</span>`,
                            steps: [
                                { prompt: T(lang, "選出展開括號後的中間式：", "Select expression after expansion:"), correct: step1Corr, options: makeDistractors(step1Corr, `${a}x + ${b} - ${c*d}x - ${e}`, `${a}x + ${a*b} - ${c*d}x - ${c*e}`, `${a}x + ${a*b} + ${c*d}x + ${c*e}`, seed), explanation: `${T(lang, '展開：', 'Expanding: ')}${a}×x + ${a}×${b} - ${c}×${d}x - ${c}×(-${e}) = ${step1Corr}` },
                                { prompt: T(lang, "合併同類項，得出最終簡化答案：", "Combine like terms:"), correct: finalAns, options: makeDistractors(finalAns, `${formatTerm(a + c*d, 'x', true)} ${formatTerm(a*b - c*e, '', false)}`.trim(), `${formatTerm(a - c*d, 'x', true)} ${formatTerm(a*b - c*e, '', false)}`.trim(), `${formatTerm(a + c*d, 'x', true)} ${formatTerm(a*b + c*e, '', false)}`.trim(), seed+1), explanation: `化簡得 ${finalAns}。` }
                            ]
                        };
                    } else if (lesson.id === "L1") {
                        const k = getInt(seed,1, 2, 9); const c = getInt(seed,2, 2, 8); const b = getInt(seed,3, 1, 9);
                        const unexpandedLHS = `${k}(x - ${b}) + ${c}x`; const expandedLHS = `${k}x - ${k*b} + ${c}x`; const finalLHS = `${k+c}x - ${k*b}`;
                        const lhsLabel = lang === 'zh' ? "左方" : "L.H.S."; const rhsLabel = lang === 'zh' ? "右方" : "R.H.S.";
                        const step1Corr = `${lhsLabel} = ${unexpandedLHS}`;
                        const step2Corr = `= ${expandedLHS}<br/>= ${finalLHS}`;
                        const step3Corr = `${rhsLabel} = ${finalLHS}<br/>∵ ${lhsLabel} = ${rhsLabel}<br/>∴ ${unexpandedLHS} ≡ ${finalLHS}`;
                        qData = {
                            rawExpr: `${unexpandedLHS} ≡ ${finalLHS}`,
                            title: `${T(lang, '證明恆等式：', 'Prove identity: ')}<span class="katex-mock">${unexpandedLHS} ≡ ${finalLHS}</span>`,
                            steps: [
                                { prompt: T(lang, "1. 抄寫等式的左方 (左方 = …)：", "1. Write down L.H.S. (L.H.S. = …):"), correct: step1Corr, options: makeDistractors(step1Corr, `${lhsLabel} = ${expandedLHS}`, `${lhsLabel} = ${finalLHS}`, `${lhsLabel} = ${k}x + ${c}x`, seed), explanation: T(lang, "第一步先抄下左邊原式，暫不展開。", "First step is to write down L.H.S.") },
                                { prompt: T(lang, "2. 展開左方並化簡 (等於符號對齊)：", "2. Expand and simplify L.H.S.:"), correct: step2Corr, options: makeDistractors(step2Corr, `= ${k}x - ${b} + ${c}x<br/>= ${k+c}x - ${b}`, `= ${k}x + ${k*b} + ${c}x<br/>= ${k+c}x + ${k*b}`, `= ${k}x - ${k*b} - ${c}x<br/>= ${k-c}x - ${k*b}`, seed+1), explanation: T(lang, `展開並合併得 ${finalLHS}。`, `Expanded and simplified to ${finalLHS}.`) },
                                { prompt: T(lang, "3. 寫出右方，比較左方與右方並用『∵、∴』作結：", "3. Write R.H.S., compare with ∵ and ∴:"), correct: step3Corr, options: [step3Corr, `${rhsLabel} = ${finalLHS}<br/>∵ ${lhsLabel} ≠ ${rhsLabel}<br/>∴ ${unexpandedLHS} ≢ ${finalLHS}`, `${rhsLabel} = ${finalLHS}<br/>∵ ${lhsLabel} = ${rhsLabel}<br/>∴ ${T(lang, "該方程不是恆等式", "not an identity")}`, `${rhsLabel} = ${finalLHS}<br/>∴ ${T(lang, "當且僅當 x = 0 時 左方 = 右方", "L.H.S. = R.H.S. only when x = 0")}`], explanation: T(lang, `∵ 左方 = 右方，∴ 原式 ≡ 右方。`, `Since ∵ L.H.S. = R.H.S., therefore ∴ proved.`) }
                            ]
                        };
                    } else if (lesson.id === "L2_L3") {
                        const A = getInt(seed,1, 2, 6);
                        const p = getInt(seed,2, 1, 6);
                        let B = getInt(seed,3, -9, 9);
                        if (B === 0) B = 2; // avoid 0 for better visual
                        
                        const c = A;
                        const q = getInt(seed,5, 1, 6);
                        const signQ = prng(seed + 6) > 0.5 ? 1 : -1;
                        
                        const constSum = p * A + B;
                        const cq = c * q * signQ;
                        const d = constSum - cq;
                        
                        const signQ_str = signQ > 0 ? '+' : '-';
                        const signD_str = d >= 0 ? '+' : '-';
                        const signB_str = B > 0 ? '+' : '-';
                        
                        // LHS format: A(x + p) + B (or - B)
                        const unexpandedLHS = B > 0 ? `A(x + ${p}) + ${B}` : `A(x + ${p}) - ${Math.abs(B)}`;
                        const expandedLHS = B > 0 ? `Ax + ${p}A + ${B}` : `Ax + ${p}A - ${Math.abs(B)}`;
                        
                        const unexpandedRHS = `${c}(x ${signQ_str} ${q}) ${signD_str} ${Math.abs(d)}`;
                        const expandedRHS = `${c}x ${cq >= 0 ? '+' : '-'} ${Math.abs(cq)} ${signD_str} ${Math.abs(d)}`;
                        const finalRHS = constSum === 0 ? `${c}x` : `${c}x ${constSum > 0 ? '+' : '-'} ${Math.abs(constSum)}`;
                        
                        const lhsLabel = lang === 'zh' ? "左方" : "L.H.S.";
                        const rhsLabel = lang === 'zh' ? "右方" : "R.H.S.";
                        
                        const step1Corr = `${lhsLabel} = ${unexpandedLHS}`;
                        const step2Corr = `= ${expandedLHS}`;
                        const step3Corr = `${rhsLabel} = ${unexpandedRHS}`;
                        const step4Corr = `= ${expandedRHS}<br/>= ${finalRHS}`;
                        const step5Corr = `∵ 展開的左方 ≡ 展開的右方<br/>∴ ${expandedLHS} ≡ ${finalRHS}`;
                        const step6Corr = lang === 'zh' ? `比較同類項 (x 的係數)：<br/>A = ${c}` : `Compare like terms (x coeff):<br/>A = ${c}`;
                        // For display in constant substitution text
                        const bDisp = B > 0 ? `+ ${B}` : `- ${Math.abs(B)}`;
                        const step7Corr = lang === 'zh' ? `比較同類項 (常數項)：<br/>${p}A ${bDisp} = ${constSum}<br/>代入 A = ${c}，解得 B = ${B}` : `Compare constant terms:<br/>${p}A ${bDisp} = ${constSum}<br/>Sub A = ${c}, B = ${B}`;
                        
                        qData = {
                            rawExpr: `${unexpandedLHS} ≡ ${unexpandedRHS}`,
                            title: `${T(lang, '已知恆等式 ', 'Given identity ')}<span class="katex-mock">${unexpandedLHS} ≡ ${unexpandedRHS}</span>${T(lang, '，求未知常數 A 及 B。', ', find A and B.')}`,
                            steps: [
                                { prompt: T(lang, "1. 左方 = (照抄)：", "1. L.H.S. = (copy):"), correct: step1Corr, options: makeDistractors(step1Corr, `${lhsLabel} = Ax + ${p}A ${bDisp}`, `${lhsLabel} = A(x) ${bDisp}`, `${lhsLabel} = ${expandedLHS}`, seed), explanation: T(lang, "第一步先照抄左方原式。", "First step: copy L.H.S. as given.") },
                                { prompt: T(lang, "2. 左方 = (展開化解)：", "2. L.H.S. = (expand):"), correct: step2Corr, options: makeDistractors(step2Corr, `= Ax ${bDisp}`, `= A(x + ${p}) ${bDisp}`, `= Ax + ${p} ${bDisp}`, seed+1), explanation: T(lang, `將左方括號展開。`, `Expand the bracket on L.H.S.`) },
                                { prompt: T(lang, "3. 右方 = (照抄)：", "3. R.H.S. = (copy):"), correct: step3Corr, options: makeDistractors(step3Corr, `${rhsLabel} = ${finalRHS}`, `${rhsLabel} = ${expandedRHS}`, `${rhsLabel} = ${c}x + ${d}`, seed+2), explanation: T(lang, "照抄右方原式。", "Copy R.H.S. as given.") },
                                { prompt: T(lang, "4. 右方 = (展開化解)：", "4. R.H.S. = (expand & simplify):"), correct: step4Corr, options: makeDistractors(step4Corr, `= ${c}x ${signD_str} ${Math.abs(d)}<br/>= ${finalRHS}`, `= ${finalRHS}`, `= ${c}x ${signQ_str} ${q} ${signD_str} ${Math.abs(d)}<br/>= ${c}x ${constSum >= 0 ? '+' : '-'} ${Math.abs(constSum)+1}`, seed+3), explanation: T(lang, `展開右方括號並化簡為兩項。`, `Expand and simplify R.H.S.`) },

                                        {t > 0 && t < 1 && T(lang, "將左下角的長方形割下，旋轉並接駁至右上方。", "Cut bottom-left rect, rotate and connect to top right.")}
                                        {t === 1 && (isDigitized 
                                            ? T(lang, "拼成一個長為 (5+4)=9，闊為 (5-4)=1 的新長方形。", "Forms a new rectangle of length (5+4)=9 and width (5-4)=1.")
                                            : T(lang, "拼成一個長為 (a+b)，闊為 (a-b) 的新長方形。", "Forms a new rectangle of length (a+b) and width (a-b)."))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (lessonId === "L5" || lessonId === "L6_PERF_SQ") {
                const isPlus = perfMode === 'plus';
                const a_sz = isPlus ? 140 : 200;
                const b_sz = bValue; // plus: 0-100, minus: 0-140
                const a_minus_b = a_sz - b_sz;

                return (
                    <div className="bg-white text-slate-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-fuchsia-200 mb-5 animate-fade-in">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                            <div>
                                <h3 className="text-base sm:text-lg font-bold text-fuchsia-900 flex items-center gap-1.5">
                                    <IconLightbulb /> {T(lang, "完全平方 (a ± b)² 視覺化", "Perfect Square (a ± b)² Visualizer")}
                                </h3>
                                <p className="text-xs text-slate-500 mt-0.5">{T(lang, "拖拉滑桿改變 B 的長度，觀察面積組成的變化", "Drag slider to change B length and observe area composition")}</p>
                            </div>
                            <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl self-start sm:self-auto">
                                <button onClick={() => { setPerfMode('plus'); setBValue(50); }} className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${isPlus ? 'bg-fuchsia-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'}`}>(a + b)²</button>
                                <button onClick={() => { setPerfMode('minus'); setBValue(50); }} className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${!isPlus ? 'bg-orange-500 text-white shadow' : 'text-slate-600 hover:text-slate-900'}`}>(a - b)²</button>

                        <div className="grid grid-cols-1 md:grid-cols-12 gap-4 bg-slate-900 text-white p-4 sm:p-5 rounded-2xl shadow-inner">

                                <svg width="100%" height="280" viewBox="0 0 350 300" className="max-w-[350px]">
                                    {isPlus ? (
                                        <g transform="translate(40, 30)">
                                            {/* a^2 */}
                                            <rect x="0" y="0" width={a_sz} height={a_sz} fill="#3b82f6" stroke="#1d4ed8" strokeWidth="2" />
                                            <text x={a_sz/2} y={a_sz/2 + 5} fill="white" textAnchor="middle" fontWeight="bold">a²</text>
                                            
                                            {/* ab (top right) */}
                                            <rect x={a_sz} y="0" width={b_sz} height={a_sz} fill="#10b981" stroke="#047857" strokeWidth="2" opacity="0.9" />
                                            {b_sz > 20 && <text x={a_sz + b_sz/2} y={a_sz/2 + 5} fill="white" textAnchor="middle" fontWeight="bold">ab</text>}
                                            
                                            {/* ab (bottom left) */}
                                            <rect x="0" y={a_sz} width={a_sz} height={b_sz} fill="#10b981" stroke="#047857" strokeWidth="2" opacity="0.9" />
                                            {b_sz > 20 && <text x={a_sz/2} y={a_sz + b_sz/2 + 5} fill="white" textAnchor="middle" fontWeight="bold">ab</text>}
                                            
                                            {/* b^2 */}
                                            <rect x={a_sz} y={a_sz} width={b_sz} height={b_sz} fill="#f59e0b" stroke="#b45309" strokeWidth="2" opacity="0.9" />
                                            {b_sz > 25 && <text x={a_sz + b_sz/2} y={a_sz + b_sz/2 + 5} fill="white" textAnchor="middle" fontWeight="bold">b²</text>}
                                            
                                            {/* Labels */}
                                            <text x={a_sz/2} y="-10" fill="#94a3b8" textAnchor="middle">a</text>
                                            <text x={a_sz + b_sz/2} y="-10" fill="#94a3b8" textAnchor="middle">b</text>
                                            <text x="-10" y={a_sz/2 + 5} fill="#94a3b8" textAnchor="end">a</text>
                                            <text x="-10" y={a_sz + b_sz/2 + 5} fill="#94a3b8" textAnchor="end">b</text>
                                        </g>
                                    ) : (
                                        <g transform="translate(40, 30)">
                                            {/* Total a^2 boundary */}
                                            <rect x="0" y="0" width={a_sz} height={a_sz} fill="none" stroke="#475569" strokeWidth="2" strokeDasharray="4" />
                                            
                                            {/* (a-b)^2 */}
                                            <rect x="0" y="0" width={a_minus_b} height={a_minus_b} fill="#3b82f6" stroke="#1d4ed8" strokeWidth="2" />
                                            {a_minus_b > 30 && <text x={a_minus_b/2} y={a_minus_b/2 + 5} fill="white" textAnchor="middle" fontWeight="bold">(a-b)²</text>}
                                            
                                            {/* top right subtracted */}
                                            <rect x={a_minus_b} y="0" width={b_sz} height={a_sz} fill="#ef4444" fillOpacity="0.6" stroke="#b91c1c" strokeWidth="2" />
                                            {b_sz > 20 && <text x={a_minus_b + b_sz/2} y={a_minus_b/2 + 5} fill="white" textAnchor="middle" fontSize="13" fontWeight="bold">-ab</text>}
                                            
                                            {/* bottom left subtracted */}
                                            <rect x="0" y={a_minus_b} width={a_sz} height={b_sz} fill="#ef4444" fillOpacity="0.6" stroke="#b91c1c" strokeWidth="2" />
                                            {b_sz > 20 && <text x={a_minus_b/2} y={a_minus_b + b_sz/2 + 5} fill="white" textAnchor="middle" fontSize="13" fontWeight="bold">-ab</text>}
                                            
                                            {/* bottom right b^2 */}
                                            <rect x={a_minus_b} y={a_minus_b} width={b_sz} height={b_sz} fill="#f59e0b" fillOpacity="0.9" stroke="#b45309" strokeWidth="2" />
                                            {b_sz > 25 && <text x={a_minus_b + b_sz/2} y={a_minus_b + b_sz/2 + 5} fill="white" textAnchor="middle" fontWeight="bold">+b²</text>}
                                            
                                            {/* Labels */}
                                            <text x={a_minus_b/2} y="-10" fill="#94a3b8" textAnchor="middle">a-b</text>
                                            <text x={a_minus_b + b_sz/2} y="-10" fill="#94a3b8" textAnchor="middle">b</text>
                                            <text x="-10" y={a_minus_b/2 + 5} fill="#94a3b8" textAnchor="end">a-b</text>
                                            <text x="-10" y={a_minus_b + b_sz/2 + 5} fill="#94a3b8" textAnchor="end">b</text>
                                            <text x={a_sz/2} y={a_sz + 25} fill="#fcd34d" textAnchor="middle" fontWeight="bold">大正方形總邊長 = a</text>
                                        </g>
                                    )}
                                </svg>
                            </div>
                            <div className="md:col-span-5 flex flex-col justify-center space-y-4">
                                <div>
                                    <div className="flex items-center justify-between text-xs mb-1 font-mono">
                                        <span className={isPlus ? "text-fuchsia-300 font-bold" : "text-orange-300 font-bold"}>調整 B 的大小</span>
                                    </div>
                                    <input type="range" min="0" max={isPlus ? 100 : 140} value={bValue} onChange={(e) => setBValue(parseInt(e.target.value))} className="w-full" />
                                </div>
                                
                                <div className={`p-4 rounded-xl border ${isPlus ? 'bg-fuchsia-950/40 border-fuchsia-500/30' : 'bg-orange-950/40 border-orange-500/30'}`}>
                                    <span className={`font-sans text-[11px] font-bold block mb-1 ${isPlus ? 'text-fuchsia-300' : 'text-orange-300'}`}>面積公式：</span>
                                    <div className="text-slate-200 text-base sm:text-lg font-mono mb-2">
                                        {isPlus ? (
                                            <span>(a + b)² = a² + <span className="text-emerald-400">2ab</span> + <span className="text-amber-400">b²</span></span>
                                        ) : (
                                            <span>(a - b)² = a² - <span className="text-rose-400">2ab</span> + <span className="text-amber-400">b²</span></span>
                                        )}
                                    </div>
                                    <div className="text-xs text-slate-400 leading-relaxed">
                                        {isPlus 
                                            ? T(lang, "大正方形的邊長為 (a+b)。總面積可分割為 1 個 a² 正方形、2 個 ab 長方形，以及右下角的 1 個 b² 小正方形。", "Big square side is (a+b). Area is split into a² square, two ab rects, and a b² square at bottom-right.")
                                            : T(lang, "從邊長為 a 的大正方形中，減去兩個 a×b 的長方形 (-2ab)。因為右下角的小正方形被重複減了兩次，所以需要加回一次 (+b²)。", "From big square side a, subtract two a×b rects (-2ab). Since bottom-right small square is subtracted twice, add it back (+b²).")}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            return null;
        };
        
        const StepByStepQuizEngine = ({ lessonId, lang }) => {
            const [questions, setQuestions] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            const [stepStatus, setStepStatus] = useState([]);
            const [currentActiveStep, setCurrentActiveStep] = useState(0);
            const [attemptsLeft, setAttemptsLeft] = useState([]);
            const [isQuizSummary, setIsQuizSummary] = useState(false);
            const [scoreHistory, setScoreHistory] = useState([]);
            const questionBank = useMemo(() => generateQuestionBank(lang), [lang]);
            
            useEffect(() => {
                const filtered = questionBank.filter(q => q.lessonId === lessonId);
                const shuffled = [...filtered].sort(() => Math.random() - 0.5).slice(0, 3);
                setQuestions(shuffled);
                setQIndex(0);
                setIsQuizSummary(false);
                setScoreHistory([]);
                if (shuffled.length > 0) initQuestionSteps(shuffled[0]);
            }, [lessonId, lang]);
            
            const initQuestionSteps = (q) => {
                if (!q) return;
                const status = q.steps.map(() => ({ selectedOption: null, isCorrect: null, completed: false }));
                const attempts = q.steps.map(() => 2);
                setStepStatus(status);
                setAttemptsLeft(attempts);
                setCurrentActiveStep(0);
            };
            
            const currentQ = questions[qIndex];
            
            const handleSelectOption = (sIdx, option) => {
                if (sIdx !== currentActiveStep) return;
                const stepData = currentQ.steps[sIdx];
                const isCorrect = option === stepData.correct;
                const newStatus = [...stepStatus];
                const newAttempts = [...attemptsLeft];
                newStatus[sIdx].selectedOption = option;
                if (isCorrect) {
                    newStatus[sIdx].isCorrect = true;
                    newStatus[sIdx].completed = true;
                } else {
                    newAttempts[sIdx] -= 1;
                    if (newAttempts[sIdx] <= 0) {
                        newStatus[sIdx].isCorrect = false;
                        newStatus[sIdx].completed = true;
                    } else {
                        newStatus[sIdx].isCorrect = false;
                    }
                }
                setStepStatus(newStatus);
                setAttemptsLeft(newAttempts);
            };
            
            const handleNextStep = () => setCurrentActiveStep(prev => prev + 1);
            
            const handleNextQuestion = () => {
                const correctCount = stepStatus.filter(s => s.isCorrect).length;
                const questionScore = Math.round((correctCount / stepStatus.length) * 100);
                setScoreHistory([...scoreHistory, { qIndex, score: questionScore }]);
                if (qIndex < questions.length - 1) {
                    const nextQIdx = qIndex + 1;
                    setQIndex(nextQIdx);
                    initQuestionSteps(questions[nextQIdx]);
                } else {
                    setIsQuizSummary(true);
                }
            };
            
            const handleRestartQuiz = () => {
                const filtered = questionBank.filter(q => q.lessonId === lessonId);
                const shuffled = [...filtered].sort(() => Math.random() - 0.5).slice(0, 3);
                setQuestions(shuffled); setQIndex(0); setIsQuizSummary(false); setScoreHistory([]);
                if (shuffled.length > 0) initQuestionSteps(shuffled[0]);
            };
            
            if (!currentQ && !isQuizSummary) return <div className="p-8 text-center text-slate-500 font-bold">{T(lang, "載入題目中...", "Loading questions...")}</div>;
            if (isQuizSummary) {
                const avgScore = Math.round(scoreHistory.reduce((a, b) => a + b.score, 0) / scoreHistory.length);
                return (
                    <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 text-center animate-fade-in">
                        <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">🏆</div>
                        <h3 className="text-xl sm:text-2xl font-black text-slate-800 mb-1">{T(lang, "單元練習完成！", "Unit Practice Completed!")}</h3>
                        <p className="text-slate-600 text-xs sm:text-sm mb-5">{T(lang, "你已順利完成本單元 3 條分步訓練題。", "Completed 3 step-by-step training questions.")}</p>
                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 max-w-xs mx-auto mb-5">
                            <span className="text-[11px] text-slate-500 uppercase font-bold tracking-wider">{T(lang, "平均表現得分", "Average Score")}</span>
                            <div className="text-3xl font-black text-indigo-600 mt-1">{avgScore}%</div>
                        </div>
                        <button onClick={handleRestartQuiz} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2 mx-auto"><IconRefresh /> <span>{T(lang, "再練一組新題目", "Try Another 3 Questions")}</span></button>
                    </div>
                );
            }
            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in">
                    <div className="p-3.5 sm:p-5 bg-slate-900 text-white flex justify-between items-center border-b border-slate-800 sticky top-0 z-20">
                        <div>
                            <span className="text-[10px] sm:text-xs text-amber-400 font-bold uppercase tracking-wider block">{currentQ.category}</span>
                            <h3 className="text-sm sm:text-base font-bold mt-0.5">{T(lang, `題目 ${qIndex + 1} / 3`, `Question ${qIndex + 1} / 3`)}</h3>
                        </div>
                        <div className="flex gap-1.5">
                            {[0, 1, 2].map(idx => (<div key={idx} className={`w-2.5 h-2.5 rounded-full ${idx === qIndex ? 'bg-amber-400 ring-2 ring-amber-300' : (idx < qIndex ? 'bg-emerald-500' : 'bg-slate-700')}`} />))}
                        </div>
                    </div>
                    
                    {}
                    <div className="p-4 sm:p-5 bg-slate-50 border-b border-slate-200">
                        <div className={`text-sm sm:text-base font-bold text-slate-800 ${!currentQ.hideStepByStepDeduction ? 'mb-3' : ''}`} dangerouslySetInnerHTML={{ __html: currentQ.title }}></div>
                        {!currentQ.hideStepByStepDeduction && (
                            <div className="bg-slate-900 text-slate-100 p-3.5 sm:p-4 rounded-xl font-mono text-xs sm:text-sm border border-slate-700 shadow-inner">
                                <div className="text-[11px] text-amber-400 font-sans font-bold mb-2.5 flex items-center justify-between border-b border-slate-800 pb-1.5">
                                    <span className="flex items-center gap-1.5"><span>📝</span> {T(lang, "學生答題推導過程", "Student Step-by-Step Working")}:</span>
                                    <span className="text-[10px] bg-indigo-900/80 text-indigo-200 px-2 py-0.5 rounded border border-indigo-700/50 font-sans">{T(lang, "即時推導展示", "Live Progressive Deduction")}</span>
                                </div>
                                <div className="space-y-2 pl-2 sm:pl-3 border-l-2 border-indigo-500/60 font-mono">
                                    <div className="text-amber-300 font-bold tracking-wide flex items-center gap-2">
                                        <span className="text-slate-500 text-[10px] font-sans w-14 flex-shrink-0">{T(lang, "原題", "Expr")}</span>
                                        <span>{currentQ.rawExpr}</span>
                                    </div>
                                    {currentQ.steps.map((stepData, idx) => {
                                        const status = stepStatus[idx];
                                        if (!status) return null;
                                        const isCompleted = status.completed;
                                        const isCurrent = idx === currentActiveStep;
                                        
                                        if (isCompleted) {
                                            const correctAns = stepData.correct;
                                            const needsEquals = !correctAns.startsWith('=') && !correctAns.startsWith('左方') && !correctAns.startsWith('L.H.S.') && !correctAns.startsWith('右方') && !correctAns.startsWith('R.H.S.') && !correctAns.startsWith('比較') && !correctAns.startsWith('Comparing') && !correctAns.startsWith('∵') && !correctAns.startsWith('∴') && !correctAns.startsWith('(a)') && !correctAns.startsWith('(b)') && !correctAns.includes('Expansion') && !correctAns.includes('Factorization');
                                            const isFinalStep = idx === currentQ.steps.length - 1;
                                            return (
                                                <div key={idx} className={`font-bold animate-fade-in flex items-start gap-2 ${isFinalStep ? 'text-emerald-300 bg-emerald-950/40 p-1.5 rounded border border-emerald-800/50' : 'text-emerald-400'}`}>
                                                    <span className="text-slate-400 text-[10px] font-sans w-14 flex-shrink-0 pt-0.5">{isFinalStep ? T(lang, "最終結論", "Final") : T(lang, `步驟 ${idx + 1}`, `Step ${idx + 1}`)}</span>
                                                    <span className="font-mono flex-1 leading-snug" dangerouslySetInnerHTML={{ __html: needsEquals ? `= ${correctAns}` : correctAns }}></span>
                                                    <span className="text-emerald-400 text-xs ml-1 font-sans">✓</span>
                                                </div>
                                            );
                                        }
                                        if (isCurrent) {
                                            return (
                                                <div key={idx} className="text-amber-400/90 font-bold animate-pulse flex items-center gap-2 pt-0.5">
                                                    <span className="text-slate-400 text-[10px] font-sans w-14 flex-shrink-0">{T(lang, `步驟 ${idx + 1}`, `Step ${idx + 1}`)}</span>
                                                    <span className="bg-amber-400/20 px-2 py-0.5 rounded text-amber-300 border border-amber-400/30 text-xs font-sans">= ? ({T(lang, "請點選下方選項解答", "Select option below")})</span>
                                                </div>
                                            );
                                        }
                                        return null;
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {}
                    <div className="p-4 sm:p-5 space-y-4">
                        {/* 已經根據要求移除短除法輔助圖 (ShortDivisionDiagram) 在即時訓練中的顯示 */}
                        
                        {currentQ.steps.map((stepData, sIdx) => {
                            const status = stepStatus[sIdx]; if (!status) return null;
                            const isVisible = sIdx <= currentActiveStep; if (!isVisible) return null;
                            const isCurrent = sIdx === currentActiveStep; const isCompleted = status.completed; const isLastStep = sIdx === currentQ.steps.length - 1;
                            
                            if (!isCurrent && isCompleted) {
                                return (
                                    <div key={sIdx} className="p-3 bg-emerald-50/70 border border-emerald-200 rounded-xl text-xs sm:text-sm flex items-center justify-between gap-2 animate-fade-in">
                                        <div className="flex items-center gap-2 overflow-hidden"><span className="w-5 h-5 rounded-full bg-emerald-600 text-white text-[11px] font-bold flex items-center justify-center flex-shrink-0">{sIdx + 1}</span><span className="text-slate-700 font-medium truncate" dangerouslySetInnerHTML={{ __html: stepData.prompt }}></span></div>
                                        <div className="flex items-center gap-1 font-mono font-bold text-emerald-800 flex-shrink-0 bg-emerald-100 px-2.5 py-1 rounded-lg border border-emerald-300 text-xs"><IconCheck /> <span className="truncate max-w-[160px] sm:max-w-none" dangerouslySetInnerHTML={{ __html: stepData.correct }}></span></div>
                                    </div>
                                );
                            }
                            return (
                                <div key={sIdx} className={`p-4 rounded-xl border-2 transition-all duration-300 ${isCurrent ? 'border-indigo-500 bg-indigo-50/20 ring-1 ring-indigo-100 shadow-sm' : 'border-slate-200 bg-slate-50'}`}>
                                    <div className="flex items-start justify-between mb-2.5 w-full">
                                        <div className={`font-bold text-xs sm:text-sm flex items-start gap-2 flex-1 ${isCurrent ? 'text-indigo-900' : 'text-slate-700'}`}>
                                            <span className={`w-5 h-5 mt-0.5 rounded-full text-white text-[11px] flex items-center justify-center font-bold flex-shrink-0 ${isCurrent ? 'bg-indigo-600' : 'bg-slate-400'}`}>{sIdx + 1}</span>
                                            <div className="flex-1" dangerouslySetInnerHTML={{ __html: stepData.prompt }}></div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
                                        {stepData.options.map((opt, optIdx) => {
                                            let btnStyle = "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-700";
                                            if (status.selectedOption === opt) {
                                                if (opt === stepData.correct) { btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-1 ring-emerald-300"; } 
                                                else { btnStyle = "border-rose-500 bg-rose-50 text-rose-900 font-bold"; }
                                            } else if (isCompleted && opt === stepData.correct) { btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-800 font-bold"; }
                                            return (
                                                <button key={optIdx} onClick={() => handleSelectOption(sIdx, opt)} disabled={!isCurrent || isCompleted} className={`p-3 rounded-xl border text-left font-serif text-xs sm:text-sm font-bold tracking-wide transition-all flex justify-between items-center gap-2 ${btnStyle} ${(!isCurrent || isCompleted) ? 'cursor-default' : ''}`}>
                                                    <span className="flex-1 break-words leading-relaxed" dangerouslySetInnerHTML={{ __html: opt }}></span>
                                                    {status.selectedOption === opt && opt === stepData.correct && <IconCheck />}
                                                    {status.selectedOption === opt && opt !== stepData.correct && <IconCross />}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    {status.isCorrect === false && !isCompleted && (
                                        <div className="mt-2.5 p-2.5 bg-amber-50 border border-amber-300 rounded-lg flex items-center justify-between text-xs text-amber-900 animate-pulse-subtle">
                                            <div className="flex items-center gap-1"><IconLightbulb /><span>{T(lang, "答錯了！請再試一次。", "Incorrect! Try again.")}</span></div>
                                            <button onClick={() => { const newStatus = [...stepStatus]; newStatus[sIdx].selectedOption = null; setStepStatus(newStatus); }} className="px-2.5 py-1 bg-amber-600 text-white text-[11px] font-bold rounded-lg hover:bg-amber-700 transition">{T(lang, "重試", "Retry")}</button>
                                        </div>
                                    )}
                                    {isCompleted && (
                                        <div className={`mt-3 p-3 border rounded-xl text-xs ${isLastStep ? 'bg-blue-50/90 border-blue-200 text-blue-950' : 'bg-emerald-50/80 border-emerald-200 text-emerald-950'}`}>
                                            <p className={`font-bold mb-1 flex items-center gap-1 ${isLastStep ? 'text-blue-900' : 'text-emerald-800'}`}><IconLightbulb /> {isLastStep ? T(lang, "最終解答解說：", "Final Explanation:") : T(lang, `步驟 ${sIdx + 1} 解說：`, `Step ${sIdx + 1} Explanation:`)}</p>
                                            <div className="font-sans leading-relaxed" dangerouslySetInnerHTML={{ __html: stepData.explanation }}></div>
                                            {isCurrent && !isLastStep && (
                                                <button onClick={handleNextStep} className="mt-3 px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow hover:bg-indigo-700 transition flex items-center gap-1 w-full justify-center">
                                                    {T(lang, `進入【步驟 ${sIdx + 2}】`, `Proceed to [Step ${sIdx + 2}]`)} <IconArrowRight />
                                                </button>
                                            )}
                                            {isCurrent && isLastStep && (
                                                <div className="mt-3 pt-2.5 border-t border-blue-200 flex flex-col sm:flex-row justify-between items-center gap-2">
                                                    <span className="text-emerald-700 font-bold flex items-center gap-1 text-xs">🎉 {T(lang, "本題完成！已成功推導至最終答案。", "Question completed! Successfully deduced final answer.")}</span>
                                                    <button onClick={handleNextQuestion} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition active:scale-95 flex items-center gap-1 w-full sm:w-auto justify-center">
                                                        {qIndex < 2 ? T(lang, "下一條練習題", "Next Question") : T(lang, "查看練習總結", "View Summary")} <IconArrowRight />
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };
        
        const App = () => {
            const [lang, setLang] = useState('zh');
            const [activeLessonId, setActiveLessonId] = useState("LO"); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const syllabus = getLessonSyllabus(lang);
            const activeLesson = syllabus.find(l => l.id === activeLessonId) || syllabus[0];
            
            const handleSelectLesson = (id) => { setActiveLessonId(id); setIsSidebarOpen(false); };
            
            return (
                <div className="min-h-screen flex bg-slate-100 overflow-x-hidden relative">
                    {!isSidebarOpen && (
                        <button onClick={() => setIsSidebarOpen(true)} className="fixed top-3 left-3 z-40 bg-white border border-slate-200 text-indigo-700 p-2.5 rounded-xl shadow-lg hover:bg-indigo-50 hover:border-indigo-300 transition-all flex items-center justify-center gap-1.5 group animate-fade-in focus:outline-none">
                            <IconMenu /><span className="font-bold text-xs hidden sm:inline-block group-hover:text-indigo-800">{T(lang, "單元選單", "Lessons")}</span>
                        </button>
                    )}
                    {isSidebarOpen && <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 md:hidden transition-opacity" onClick={() => setIsSidebarOpen(false)} />}
                    <aside className={`fixed inset-y-0 left-0 z-50 w-72 sm:w-80 bg-slate-900 text-slate-100 flex flex-col shadow-2xl transition-transform duration-300 ease-out transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 bg-slate-950 border-b border-slate-800 flex justify-between items-start">
                            <div><span className="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">{T(lang, "F.2 中二數學 Ch.2", "F.2 Math Ch.2")}</span><h1 className="text-base sm:text-lg font-black mt-0.5 text-white">{T(lang, "恆等式與因式分解", "Identities & Factorization")}<br/><span className="text-amber-400 text-xs font-normal">{T(lang, "分步訓練平台", "Step-by-Step Platform")}</span></h1></div>
                            <button onClick={() => setIsSidebarOpen(false)} className="text-slate-400 hover:text-white p-1 rounded-full hover:bg-slate-800 transition-colors"><IconCross /></button>
                        </div>
                        <div className="p-2.5 bg-slate-900 border-b border-slate-800 flex justify-center gap-2">
                            <button onClick={() => setLang('zh')} className={`px-3 py-1 rounded-lg text-xs font-bold transition-colors ${lang === 'zh' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>中文</button>
                            <button onClick={() => setLang('en')} className={`px-3 py-1 rounded-lg text-xs font-bold transition-colors ${lang === 'en' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-800 text-slate-700 hover:bg-slate-700'}`}>English</button>
                        </div>
                        <nav className="flex-1 overflow-y-auto p-2.5 space-y-1 hide-scrollbar">
                            <div className="text-[11px] font-bold text-slate-500 px-2.5 pt-1 pb-1 uppercase">{T(lang, "課堂單元 (共14單元)", "Lessons (14 Units)")}</div>
                            {syllabus.map((lesson) => {
                                const isActive = lesson.id === activeLessonId;
                                return (
                                    <button key={lesson.id} onClick={() => handleSelectLesson(lesson.id)} className={`w-full text-left p-2.5 rounded-xl transition flex flex-col ${isActive ? 'bg-indigo-600 text-white font-bold shadow ring-1 ring-indigo-400' : 'hover:bg-slate-800 text-slate-300'}`}>
                                        <span className="text-xs sm:text-sm">{lesson.title}</span><span className={`text-[10px] mt-0.5 ${isActive ? 'text-indigo-200' : 'text-slate-500'}`}>{lesson.category}</span>
                                    </button>
                                );
                            })}
                        </nav>
                        <div className="p-2.5 bg-slate-950 border-t border-slate-800 text-[11px] text-slate-400 text-center whitespace-pre-line">{T(lang, "中二數學教學流程\nStep-by-Step 引導訓練", "F.2 Math Curriculum\nStep-by-Step Guided Training")}</div>
                    </aside>
                    <main className={`flex-1 min-h-screen overflow-y-auto transition-all duration-300 ease-out w-full ${isSidebarOpen ? 'md:ml-80' : 'ml-0'}`}>
                        <div className={`p-3.5 md:p-6 max-w-4xl mx-auto w-full transition-all duration-300 ${!isSidebarOpen ? 'pt-16 md:pt-6' : 'pt-3 md:pt-6'}`}>
                            <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 mb-4 animate-fade-in">
                                <div className="flex items-center gap-2 mb-1"><span className="bg-indigo-100 text-indigo-800 text-[11px] font-bold px-2.5 py-0.5 rounded-full">{activeLesson.category}</span><h2 className="text-xl sm:text-2xl font-black text-slate-800">{activeLesson.title}</h2></div>
                                <p className="text-slate-600 text-sm">{activeLesson.desc}</p>
                            </div>
                            <ConceptVisualizer lessonId={activeLessonId} lang={lang} />
                            <StepByStepQuizEngine lessonId={activeLessonId} lang={lang} />
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
