<!DOCTYPE html>

<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const T = (lang, zh, en) => lang === 'zh' ? zh : en;

        const IconCheck = () => <svg className="w-5 h-5 text-emerald-500 inline-block flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>;
        const IconCross = () => <svg className="w-5 h-5 text-rose-500 inline-block flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12" /></svg>;
        const IconRefresh = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
        const IconLightbulb = () => <svg className="w-5 h-5 text-amber-500 inline-block mr-1 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14H8a4 4 0 01-3.496-5.961C5.163 6.828 6.5 5.5 8.25 5.5h3.5c1.75 0 3.087 1.328 3.746 2.539A4 4 0 0112 14z" /></svg>;
        const IconMenu = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>;
        const IconArrowRight = () => <svg className="w-4 h-4 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;

        const getLessonSyllabus = (lang) => [
            { id: "LO", title: T(lang, "LO 重溫多項式加減乘除", "L0 Revision: Polynomial Operations"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "鞏固同類項合併、同底數相乘及多項式展開基本功。", "Consolidate basics of combining like terms and polynomial expansion.") },
            { id: "L1", title: T(lang, "L1 2.1 證明恆等式", "L1 2.1 Proving Identities"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "學習比較左方與右方證明恆等式。嚴格遵循『左方 = …』、『右方 = …』及『∵ / ∴』結論格式。", "Learn to prove identities by comparing L.H.S. and R.H.S., using ∵ and ∴.") },
            { id: "L2_L3", title: T(lang, "L2-L3 2.1 恆等式求未知常數 A, B", "L2-L3 2.1 Finding Unknowns A, B in Identities"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "展開左方後，透過『比較同類項 (Comparing like terms)』求未知常數 A 及 B。", "Expand L.H.S. and find unknowns A and B by comparing like terms.") },
            { id: "L4", title: T(lang, "L4 2.2 a² - b² 平方差展開", "L4 2.2 a² - b² Difference of Two Squares"), category: T(lang, "展開公式", "Expansion Formulas"), desc: T(lang, "掌握平方差展開法，強調必須先寫出 ( )² - ( )² 中間步驟。", "Master difference of two squares expansion, emphasizing the ( )² - ( )² step.") },
            { id: "L5", title: T(lang, "L5 2.2 (a±b)² 完全平方展開", "L5 2.2 (a±b)² Perfect Square Expansion"), category: T(lang, "展開公式", "Expansion Formulas"), desc: T(lang, "運用完全平方公式展開，必須先列出 a² ± 2ab + b² 中間步驟。", "Use perfect square formula for expansion, listing the a² ± 2ab + b² step first.") },
            { id: "L6_EXP_MIXED", title: T(lang, "L6 2.2 綜合展開 (三式訓練)", "L6 2.2 Mixed Expansion (3 Types)"), category: T(lang, "展開公式", "Expansion Formulas"), desc: T(lang, "綜合辨識並應用平方差及完全平方三條公式進行徹底展開。", "Comprehensively identify and apply the 3 formulas for expansion.") },
            { id: "L6_L1", title: T(lang, "Ch2.3 L1 因式分解 - 抽公因數/項", "Ch2.3 L1 Factorization - Common Factor"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "利用短除法視覺化分步驟尋找數值與字母的最大公因式 (HCF)。", "Use short division to visually extract HCF step-by-step.") },
            { id: "L2_BRACKET", title: T(lang, "Ch2.3 L2 因式分解 - 抽公因括號", "Ch2.3 L2 Factorization - Common Bracket"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "識別多項式中的共同括號項，如 (x + y)，並將其整體提取。", "Identify common bracket terms like (x + y) and extract them.") },
            { id: "L3_GROUPING", title: T(lang, "Ch2.3 L3 因式分解 - 併項法 (4項)", "Ch2.3 L3 Factorization - Grouping (4 terms)"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "把四項式分為兩兩一組，分別抽公因式後再抽共同括號。", "Group 4 terms into pairs, extract common factors then common brackets.") },
            { id: "L4_REVIEW", title: T(lang, "Ch2.3 L4 綜合重溫 - 短除法抽項", "Ch2.3 L4 Review - Short Division"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "利用短除法視覺化提取多項式的整體最大公因式 (HCF)。", "Use short division to visually extract overall HCF from polynomials.") },
            { id: "L5_DIFF_SQ", title: T(lang, "Ch2.3 L5 因式分解 - 平方差 a² - b²", "Ch2.3 L5 Factorization - a² - b²"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "將多項式寫成 ( )² - ( )² 後分解為 (a + b)(a - b)。", "Rewrite polynomials as ( )² - ( )² and factorize to (a + b)(a - b).") },
            { id: "L6_PERF_SQ", title: T(lang, "Ch2.3 L6 因式分解 - 完全平方 (3式)", "Ch2.3 L6 Factorization - Perfect Square (3 terms)"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "識別三項式是否符合 a² ± 2ab + b² 型態並化為 (a ± b)²。", "Check if trinomial fits a² ± 2ab + b² structure and factorize to (a ± b)².") },
            { id: "L7_MIXED3", title: T(lang, "Ch2.3 L7 因式分解 - 溫習三式", "Ch2.3 L7 Factorization - Mixed 3 types"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "靈活運用抽公因式、平方差及完全平方進行徹底分解。", "Flexibly apply HCF, difference of squares, and perfect squares for complete factorization.") },
            { id: "L8_STRUCT", title: T(lang, "Ch2.3 L8 因式分解大集合 - (a)(b)連貫題", "Ch2.3 L8 Factorization - (a)(b) Structural"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "解答公開試常見 (a) 先分解基礎式，(b) 善用 (a) 結果解複雜式。", "Solve common exam structural questions: (a) base factorization, (b) apply (a) to complex term.") },
            { id: "L9_DIFF_EX", title: T(lang, "Ch2.3 L9 區分因式分解與展開 & 級測", "Ch2.3 L9 Distinguish Expand & Factorize"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "精準分辨「展開 Expand」與「因式分解 Factorize」的反向操作。", "Accurately distinguish between the reverse operations: Expand vs Factorize.") }
        ];

        const COPRIME_PAIRS = [[2,3], [2,5], [3,4], [3,5], [3,7], [3,8], [4,5], [4,7], [4,9], [5,6], [5,7], [5,8], [5,9], [7,8], [7,9], [8,9]];

        const generateQuestionBank = (lang) => {
            const LESSON_SYLLABUS = getLessonSyllabus(lang);
            const list = [];
            let qId = 1;

            const prng = (seed) => { let x = Math.sin(seed) * 10000; return x - Math.floor(x); };
            const getInt = (seed, offset, min, max) => min + Math.floor(prng(seed + offset) * (max - min + 1));
            const getChoice = (seed, offset, arr) => arr[Math.floor(prng(seed + offset) * arr.length)];

            const makeDistractors = (correct, f1, f2, f3, seedOffset) => {
                const set = new Set([correct, f1, f2, f3]);
                const arr = Array.from(set);
                let counter = 1;
                while(arr.length < 4) { arr.push(correct + ' '.repeat(counter)); counter++; }
                return arr.sort(() => prng(seedOffset + qId) - 0.5);
            };

            const formatTerm = (coef, variable, isFirst = false) => {
                if (coef === 0) return "";
                const sign = coef > 0 ? (isFirst ? "" : "+ ") : (isFirst ? "-" : "- ");
                const absCoef = Math.abs(coef);
                const numStr = (absCoef === 1 && variable !== "") ? "" : absCoef;
                return `${sign}${numStr}${variable}`;
            };

            LESSON_SYLLABUS.forEach((lesson, lIdx) => {
                for (let i = 1; i <= 30; i++) {
                    const seed = lIdx * 10000 + i * 100;
                    let qData = {};
                    
                    const swap = prng(seed) > 0.5;
                    const hintMsg = `<br/><span class="text-indigo-600 font-bold mt-1 inline-block">💡 ${T(lang, '提示：(A)(B) 與 (B)(A) 因式乘積完全相同。', 'Note: (A)(B) and (B)(A) factors are identical.')}</span>`;

                    if (lesson.id === "LO") {
                        const a = getInt(seed,1, 2, 7); const b = getInt(seed,2, 1, 9); const c = getInt(seed,3, 2, 5); const d = getInt(seed,4, 1, 4); const e = getInt(seed,5, 1, 8);
                        const rawExpr = `${a}(x + ${b}) - ${c}(${d===1?'':d}x - ${e})`;
                        const step1Corr = `${a}x + ${a*b} - ${c*d}x + ${c*e}`;
                        const finalAns = `${formatTerm(a - c*d, 'x', true)} ${formatTerm(a*b + c*e, '', false)}`.trim();
                        qData = {
                            rawExpr: rawExpr, title: `${T(lang, '化簡多項式：', 'Simplify polynomial: ')}<span class="katex-mock">${rawExpr}</span>`,
                            steps: [
                                { prompt: T(lang, "選出展開括號後的中間式：", "Select correct expression after expanding brackets:"), correct: step1Corr, options: makeDistractors(step1Corr, `${a}x + ${b} - ${c*d}x - ${e}`, `${a}x + ${a*b} - ${c*d}x - ${c*e}`, `${a}x + ${a*b} + ${c*d}x + ${c*e}`, seed), explanation: `${T(lang, '展開：', 'Expanding: ')}${a}×x + ${a}×${b} - ${c}×${d}x - ${c}×(-${e}) = ${step1Corr}${T(lang, '。注意負負得正！', '. Note: negative times negative gives positive!')}` },
                                { prompt: T(lang, "合併同類項，得出最終簡化答案：", "Combine like terms for final answer:"), correct: finalAns, options: makeDistractors(finalAns, `${formatTerm(a + c*d, 'x', true)} ${formatTerm(a*b - c*e, '', false)}`.trim(), `${formatTerm(a - c*d, 'x', true)} ${formatTerm(a*b - c*e, '', false)}`.trim(), `${formatTerm(a + c*d, 'x', true)} ${formatTerm(a*b + c*e, '', false)}`.trim(), seed+1), explanation: `${T(lang, 'x 項：', 'x terms: ')}(${a} - ${c*d})x = ${a - c*d}x${T(lang, '；常數項：', '; Constant: ')}${a*b} + ${c*e} = ${a*b + c*e}。` }
                            ]
                        };
                    } else if (lesson.id === "L1") {
                        const k = getInt(seed,1, 2, 9); const c = getInt(seed,2, 2, 8); const b = getInt(seed,3, 1, 9);
                        const unexpandedLHS = `${k}(x - ${b}) + ${c}x`; const expandedLHS = `${k}x - ${k*b} + ${c}x`; const finalLHS = `${k+c}x - ${k*b}`;
                        const lhsLabel = lang === 'zh' ? "左方" : "L.H.S."; const rhsLabel = lang === 'zh' ? "右方" : "R.H.S.";
                        const step1Corr = `${lhsLabel} = ${unexpandedLHS}`; const step2Corr = `= ${expandedLHS}`; const step3Corr = `= ${finalLHS}`; const step4Corr = `${rhsLabel} = ${finalLHS}<br/>∵ ${lhsLabel} = ${rhsLabel}<br/>∴ ${unexpandedLHS} ≡ ${finalLHS}`;
                        qData = {
                            rawExpr: `${unexpandedLHS} ≡ ${finalLHS}`, title: `${T(lang, '證明恆等式：', 'Prove identity: ')}<span class="katex-mock">${unexpandedLHS} ≡ ${finalLHS}</span>`,
                            steps: [
                                { prompt: T(lang, "1. 抄寫等式的左方 (左方 = …)：", "1. Write L.H.S.:"), correct: step1Corr, options: makeDistractors(step1Corr, `${lhsLabel} = ${expandedLHS}`, `${lhsLabel} = ${finalLHS}`, `${lhsLabel} = ${k}x + ${c}x`, seed), explanation: T(lang, "先抄下左邊原式，暫不展開。", "Write L.H.S. as given.") },
                                { prompt: T(lang, "2. 展開左方括號 (等於符號對齊)：", "2. Expand L.H.S.:"), correct: step2Corr, options: makeDistractors(step2Corr, `= ${k}x - ${b} + ${c}x`, `= ${k}x + ${k*b} + ${c}x`, `= ${k}x - ${k*b} - ${c}x`, seed+1), explanation: T(lang, `展開。`, `Expand.`) },
                                { prompt: T(lang, "3. 化簡左方：", "3. Simplify L.H.S.:"), correct: step3Corr, options: makeDistractors(step3Corr, `= ${k-c}x - ${k*b}`, `= ${k+c}x - ${b}`, `= ${k+c}x + ${k*b}`, seed+2), explanation: T(lang, `合併同類項。`, `Combine like terms.`) },
                                { prompt: T(lang, "4. 寫出右方，比較並用『∵、∴』作結：", "4. Conclude with R.H.S.:"), correct: step4Corr, options: [step4Corr, `${rhsLabel} = ${finalLHS}<br/>∵ ${lhsLabel} ≠ ${rhsLabel}<br/>∴ ${unexpandedLHS} ≢ ${finalLHS}`, `${rhsLabel} = ${finalLHS}<br/>∵ ${lhsLabel} = ${rhsLabel}<br/>∴ 不成立`, `${rhsLabel} = ${finalLHS}<br/>∴ x = 0 時成立`], explanation: T(lang, `右方 = ${finalLHS}。因為左方 = 右方，所以恆等式成立。`, `R.H.S. = ${finalLHS}. Identity is proved.`) }
                            ]
                        };
                    } else if (lesson.id === "L2_L3") {
                        const A = getInt(seed,1, 2, 7); const p = getInt(seed,2, 1, 7); const isBNegative = prng(seed + 3) > 0.5; const B_abs = getInt(seed,4, 1, 9);
                        const signB = isBNegative ? '-' : '+'; const c = A; const d = isBNegative ? (A * p - B_abs) : (A * p + B_abs);
                        const unexpandedLHS = `A(x + ${p}) ${signB} B`; const expandedLHS = `Ax + ${p}A ${signB} B`; const rhsStr = `${c}x ${d >= 0 ? '+' : '-'} ${Math.abs(d)}`;
                        const lhsLabel = lang === 'zh' ? "左方" : "L.H.S."; const compareMsg = lang === 'zh' ? "比較同類項 (Comparing like terms)" : "Comparing like terms";
                        const step1Corr = `${lhsLabel} = ${unexpandedLHS}`; const step2Corr = `= ${expandedLHS}`;
                        const step3Corr = lang === 'zh' ? `比較同類項：<br/>x 的係數：A = ${c}` : `Comparing like terms:<br/>Coeff. of x: A = ${c}`;
                        const step4Corr = lang === 'zh' ? `比較同類項：<br/>常數項：${p}A ${signB} B = ${d}<br/>代入 A = ${c}，解得 B = ${B_abs}` : `Comparing like terms:<br/>Constant term: ${p}A ${signB} B = ${d}<br/>Sub. A = ${c}, B = ${B_abs}`;
                        qData = {
                            rawExpr: `${unexpandedLHS} ≡ ${rhsStr}`, title: `${T(lang, '已知恆等式求未知數 ', 'Find unknowns in identity ')}<span class="katex-mock">${unexpandedLHS} ≡ ${rhsStr}</span>`,
                            steps: [
                                { prompt: T(lang, "1. 抄寫左方 (左方 = …)：", "1. Write down L.H.S.:"), correct: step1Corr, options: makeDistractors(step1Corr, `${lhsLabel} = Ax + ${p} ${signB} B`, `${lhsLabel} = ${expandedLHS}`, `${lhsLabel} = A(x) ${signB} B`, seed), explanation: T(lang, "抄下左邊原式。", "Write L.H.S.") },
                                { prompt: T(lang, "2. 展開左方 (等於符號對齊)：", "2. Expand L.H.S.:"), correct: step2Corr, options: makeDistractors(step2Corr, `= Ax ${signB} B`, `= A(x + ${p}) ${signB} B`, `= Ax + ${p} ${signB} B`, seed+1), explanation: T(lang, `展開得 = ${expandedLHS}。`, `Expanded form is = ${expandedLHS}.`) },
                                { prompt: T(lang, `3. ${compareMsg}，求 A：`, `3. ${compareMsg}, find A:`), correct: step3Corr, options: makeDistractors(step3Corr, lang==='zh'?`比較同類項：<br/>x 的係數：A = ${c+2}`:`Comparing like terms:<br/>Coeff. of x: A = ${c+2}`, lang==='zh'?`比較同類項：<br/>x 的係數：A = ${p}`:`Comparing like terms:<br/>Coeff. of x: A = ${p}`, lang==='zh'?`比較同類項：<br/>x 的係數：A = 0`:`Comparing like terms:<br/>Coeff. of x: A = 0`, seed+3), explanation: T(lang, `左方 x 係數為 A，右方為 ${c}，故 A = ${c}。`, `x coeff is A on L.H.S., ${c} on R.H.S., so A = ${c}.`) },
                                { prompt: T(lang, `4. ${compareMsg}，求 B：`, `4. ${compareMsg}, find B:`), correct: step4Corr, options: makeDistractors(step4Corr, lang==='zh'?`比較同類項：<br/>常數項：${p}A ${signB} B = ${d}<br/>解得 B = ${B_abs + 2}`:`Comparing like terms:<br/>Constant term: B = ${B_abs + 2}`, lang==='zh'?`比較同類項：<br/>常數項：${p}A ${signB} B = ${d}<br/>解得 B = -${B_abs}`:`Comparing like terms:<br/>Constant term: B = -${B_abs}`, lang==='zh'?`比較同類項：<br/>常數項：B = ${d}`:`Comparing like terms:<br/>Constant term: B = ${d}`, seed+4), explanation: T(lang, `常數項為 ${p}A ${signB} B = ${d}。解得 B = ${B_abs}。`, `Constant term is ${p}A ${signB} B = ${d}. B = ${B_abs}.`) }
                            ]
                        };
                    } else if (lesson.id === "L5") {
                        const a = getInt(seed, 1, 1, 5); const b = getInt(seed, 2, 1, 9); const sign = getChoice(seed, 3, ['+', '-']);
                        const aStr = a === 1 ? 'x' : `${a}x`; const signOp = sign === '+' ? '+' : '-';
                        const origStr = `(${aStr} ${signOp} ${b})²`;
                        const step1Corr = `(${aStr})² ${signOp} 2(${aStr})(${b}) + (${b})²`;
                        const finalAns = `${a*a===1?'x²':`${a*a}x²`} ${signOp} ${2*a*b}x + ${b*b}`;
                        qData = {

                                        <div className="flex items-end w-full"><div className={`px-2.5 py-0.5 font-bold border-r-2 border-b-2 rounded-bl-sm transition-all ${sdStep >= 1 ? 'text-indigo-400 border-indigo-400 bg-indigo-950/50' : 'text-slate-600 border-slate-700'}`}>{sdStep >= 1 ? "(x + y)" : "?"}</div><div className="px-3 py-0.5 font-bold text-slate-100 border-b-2 border-indigo-400 flex-1">a(x + y) + b(x + y)</div></div>
                                        <div className="flex items-center w-full"><div className="w-20"></div><div className={`px-3 py-1 font-bold flex-1 transition-all ${sdStep >= 2 ? 'text-emerald-400' : 'text-slate-600'}`}>{sdStep >= 1 ? "a + b" : "? + ?"}</div></div>
                                    </>
                                )}
                            </div>
                            <div className="flex flex-col gap-2 text-xs text-slate-300 max-w-xs w-full">
                                <div className="p-2.5 bg-slate-800 rounded-lg border border-slate-700">
                                    <span className="font-bold text-amber-400 block mb-0.5">{T(lang, `步驟 ${sdStep + 1} 指引：`, `Step ${sdStep + 1} Guide:`)}</span>
                                    {!isBracket ? (
                                        sdStep === 0 ? T(lang, "準備進行短除法，寫出 12x² + 18xy。", "Prepare for short division: 12x² + 18xy.") :
                                        sdStep === 1 ? T(lang, "數值 12 與 18 的 HCF 為 6。剩餘 2x² + 3xy。", "HCF of 12 & 18 is 6. Leaves 2x² + 3xy.") :
                                        sdStep === 2 ? T(lang, "字母項 2x² 與 3xy 抽出 x。剩餘 2x + 3y。", "Extract x from variables. Leaves 2x + 3y.") :
                                        T(lang, "左側 HCF 相乘 × 底部剩餘項 = 6x(2x + 3y)。", "Multiply left HCF with bottom terms = 6x(2x + 3y).")
                                    ) : (
                                        sdStep === 0 ? T(lang, "原式：a(x + y) + b(x + y)。", "Original: a(x + y) + b(x + y).") :
                                        sdStep === 1 ? T(lang, "將 (x + y) 視為一個公因式整體抽出。剩餘 a + b。", "Extract (x + y) as common factor. Leaves a + b.") :
                                        T(lang, "組合得：(x + y)(a + b)。", "Combined result: (x + y)(a + b).")
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (lessonId === "L1" || lessonId === "L2_L3") {
                const isIdentityMode = mode === 'identity';
                const lhsVal = isIdentityMode ? (2 * (xVal + 3) + 3 * (xVal - 1)) : (2 * xVal + 1);
                const rhsVal = isIdentityMode ? (5 * xVal + 3) : 3;
                const isEqual = lhsVal === rhsVal;
                const mapX = (val) => 20 + ((val + 3) / 8) * 260; const mapY = (val) => 180 - ((val + 5) / 30) * 160;
                const cx = mapX(xVal); const cyLHS = mapY(lhsVal); const cyRHS = mapY(rhsVal);
                
                return (
                    <div className="bg-white text-slate-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-indigo-200 mb-5 animate-fade-in">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                            <div><h3 className="text-base sm:text-lg font-bold text-indigo-900 flex items-center gap-1.5"><IconLightbulb /> {T(lang, "恆等式 (Identity) vs 條件方程 (Equation)", "Identity vs Equation")}</h3><p className="text-xs text-slate-500 mt-0.5">{T(lang, "拉動滑桿改變 x，觀察 L.H.S. 與 R.H.S. 兩條圖像是否【完全重合】", "Drag slider to observe if L.H.S. and R.H.S. coincide completely")}</p></div>
                            <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl self-start sm:self-auto">
                                <button onClick={() => setMode('identity')} className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${isIdentityMode ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'}`}>{T(lang, "恆等式 ≡", "Identity ≡")}</button>
                                <button onClick={() => setMode('equation')} className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${!isIdentityMode ? 'bg-amber-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'}`}>{T(lang, "條件方程 =", "Equation =")}</button>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-4 bg-slate-900 text-white p-4 sm:p-5 rounded-2xl shadow-inner">
                            <div className="md:col-span-6 flex flex-col items-center justify-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                                <div className="text-[11px] text-slate-400 mb-1 flex items-center justify-between w-full font-mono">
                                    <span>y = L.H.S. (藍) vs y = R.H.S. (綠)</span>
                                    <span className={isEqual ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>{isEqual ? T(lang, "✓ 兩點重合", "✓ Points Coincide") : T(lang, "✗ 兩點分離", "✗ Points Separated")}</span>
                                </div>
                                <svg className="w-full h-48 max-w-[320px]" viewBox="0 0 300 200">
                                    <line x1="20" y1="180" x2="280" y2="180" stroke="#334155" strokeWidth="1.5" /><line x1="20" y1="20" x2="20" y2="180" stroke="#334155" strokeWidth="1.5" />
                                    <text x="285" y="184" fill="#94a3b8" fontSize="10">x</text><text x="15" y="15" fill="#94a3b8" fontSize="10">y</text>
                                    {[-2, 0, 2, 4].map(val => (<g key={val}><line x1={mapX(val)} y1="177" x2={mapX(val)} y2="183" stroke="#64748b" strokeWidth="1" /><text x={mapX(val)} y="194" fill="#64748b" fontSize="9" textAnchor="middle">{val}</text></g>))}
                                    {isIdentityMode ? <line x1={mapX(-3)} y1={mapY(-12)} x2={mapX(5)} y2={mapY(28)} stroke="#38bdf8" strokeWidth="3" strokeDasharray="4,2" /> : <line x1={mapX(-3)} y1={mapY(-5)} x2={mapX(5)} y2={mapY(11)} stroke="#38bdf8" strokeWidth="2.5" />}
                                    {isIdentityMode ? <line x1={mapX(-3)} y1={mapY(-12)} x2={mapX(5)} y2={mapY(28)} stroke="#34d399" strokeWidth="2" /> : <line x1={mapX(-3)} y1={mapY(3)} x2={mapX(5)} y2={mapY(3)} stroke="#34d399" strokeWidth="2.5" />}
                                    <line x1={cx} y1="20" x2={cx} y2="180" stroke="#f59e0b" strokeWidth="1" strokeDasharray="2,2" />
                                    {isIdentityMode ? (<g><circle cx={cx} cy={cyLHS} r="7" fill="#f59e0b" className="animate-ping opacity-75" /><circle cx={cx} cy={cyLHS} r="6" fill="#10b981" stroke="#ffffff" strokeWidth="2" /></g>) : (<g><circle cx={cx} cy={cyLHS} r="5" fill="#38bdf8" stroke="#ffffff" strokeWidth="1.5" /><circle cx={cx} cy={cyRHS} r="5" fill="#34d399" stroke="#ffffff" strokeWidth="1.5" />{!isEqual && (<line x1={cx} y1={cyLHS} x2={cx} y2={cyRHS} stroke="#f43f5e" strokeWidth="2" />)}</g>)}
                                </svg>
                            </div>
                            <div className="md:col-span-6 flex flex-col justify-between space-y-3">
                                <div><div className="flex items-center justify-between text-xs mb-1 font-mono"><span className="text-amber-300 font-bold">拖拉 x = <span className="text-lg text-amber-400 font-black">{xVal}</span></span></div><input type="range" min="-2" max="4" value={xVal} onChange={(e) => setXVal(parseInt(e.target.value))} className="w-full" /></div>
                                <div className="space-y-2 font-mono text-xs">
                                    <div className="p-2 bg-slate-800/80 rounded-xl border border-sky-500/30"><span className="text-sky-300 font-sans text-[11px] font-bold block">左方 L.H.S.</span><div className="text-slate-200">= {isIdentityMode ? `2(${xVal+3}) + 3(${xVal-1})` : `2(${xVal}) + 1`} = <span className="text-sky-400 font-bold text-sm">{lhsVal}</span></div></div>
                                    <div className="p-2 bg-slate-800/80 rounded-xl border border-emerald-500/30"><span className="text-emerald-300 font-sans text-[11px] font-bold block">右方 R.H.S.</span><div className="text-slate-200">= {isIdentityMode ? `5(${xVal}) + 3` : `3`} = <span className="text-emerald-400 font-bold text-sm">{rhsVal}</span></div></div>
                                </div>
                                <div className={`p-2.5 rounded-xl border text-xs font-sans font-bold leading-relaxed ${isEqual ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/60 border-rose-500/50 text-rose-200'}`}>
                                    {isIdentityMode ? <div><span className="text-emerald-400 block font-black">✨ 恆等式 (Identity) 特性：</span>任何 $x$ 值左方永遠等於右方，兩條線完全重合！記作 $\equiv$。</div> : <div><span className="text-amber-400 block font-black">⚠️ 條件方程 (Equation) 特性：</span>只有當 $x = 1$ 時（交點）兩邊才相等。</div>}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const StepByStepQuizEngine = ({ lessonId, lang }) => {
            const [questions, setQuestions] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            const [stepStatus, setStepStatus] = useState([]);
            const [currentActiveStep, setCurrentActiveStep] = useState(0);
            const [attemptsLeft, setAttemptsLeft] = useState([]);
            const [isQuizSummary, setIsQuizSummary] = useState(false);
            const [scoreHistory, setScoreHistory] = useState([]);

            const questionBank = useMemo(() => generateQuestionBank(lang), [lang]);
            
            // Check if this lesson is about expanding or factorizing expressions to show '=' prefix
            const isExprManipulation = ["LO", "L4", "L5", "L6_EXP_MIXED", "L6_L1", "L2_BRACKET", "L3_GROUPING", "L4_REVIEW", "L5_DIFF_SQ", "L6_PERF_SQ", "L7_MIXED3"].includes(lessonId);

            useEffect(() => {
                const filtered = questionBank.filter(q => q.lessonId === lessonId);
                const shuffled = [...filtered].sort(() => Math.random() - 0.5).slice(0, 3);
                setQuestions(shuffled);
                setQIndex(0);
                setIsQuizSummary(false);
                setScoreHistory([]);
                if (shuffled.length > 0) {
                    initQuestionSteps(shuffled[0]);
                }
            }, [lessonId, lang, questionBank]);

            const initQuestionSteps = (q) => {
                if (!q) return;
                const status = q.steps.map(() => ({ selectedOption: null, isCorrect: null, completed: false }));
                const attempts = q.steps.map(() => 2);
                setStepStatus(status);
                setAttemptsLeft(attempts);
                setCurrentActiveStep(0);
            };

            const currentQ = questions[qIndex];

            const handleSelectOption = (sIdx, option) => {
                if (sIdx !== currentActiveStep) return;
                const stepData = currentQ.steps[sIdx];
                const isCorrect = option === stepData.correct;

                const newStatus = [...stepStatus];
                const newAttempts = [...attemptsLeft];

                newStatus[sIdx].selectedOption = option;

                if (isCorrect) {
                    newStatus[sIdx].isCorrect = true;
                    newStatus[sIdx].completed = true;
                } else {
                    newAttempts[sIdx] -= 1;
                    if (newAttempts[sIdx] <= 0) {
                        newStatus[sIdx].isCorrect = false;
                        newStatus[sIdx].completed = true;
                    } else {
                        newStatus[sIdx].isCorrect = false;
                    }
                }

                setStepStatus(newStatus);
                setAttemptsLeft(newAttempts);

                if (isCorrect || newAttempts[sIdx] <= 0) {
                    if (sIdx < currentQ.steps.length - 1) {
                        setTimeout(() => setCurrentActiveStep(sIdx + 1), 600);
                    }
                }
            };

            const allStepsCompleted = stepStatus.length > 0 && stepStatus.every(s => s.completed);

            const nextQuestion = () => {
                const earned = stepStatus.filter(s => s.isCorrect).length;
                const total = currentQ.steps.length;
                setScoreHistory([...scoreHistory, { earned, total }]);

                if (qIndex < questions.length - 1) {
                    setQIndex(qIndex + 1);
                    initQuestionSteps(questions[qIndex + 1]);
                } else {
                    setIsQuizSummary(true);
                }
            };

            if (!currentQ) return <div className="text-center py-10"><div className="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div></div>;

            if (isQuizSummary) {
                const totalSteps = scoreHistory.reduce((acc, curr) => acc + curr.total, 0);
                const totalEarned = scoreHistory.reduce((acc, curr) => acc + curr.earned, 0);
                const isPerfect = totalEarned === totalSteps;
                return (
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 text-center animate-fade-in">
                        <div className="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">{T(lang, "小測完成！", "Quiz Completed!")}</h2>
                        <p className="text-lg text-slate-600 mb-6">{T(lang, "你的準確度：", "Your accuracy: ")} <span className="font-bold text-indigo-600">{totalEarned} / {totalSteps}</span></p>
                        {isPerfect && <p className="text-amber-500 font-bold mb-6 flex justify-center items-center gap-1"><IconLightbulb /> {T(lang, "太棒了！全對！", "Excellent! Perfect score!")}</p>}
                        <button onClick={() => {
                            const filtered = questionBank.filter(q => q.lessonId === lessonId);
                            const shuffled = [...filtered].sort(() => Math.random() - 0.5).slice(0, 3);
                            setQuestions(shuffled); setQIndex(0); setIsQuizSummary(false); setScoreHistory([]); initQuestionSteps(shuffled[0]);
                        }} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow hover:shadow-lg transition flex items-center justify-center gap-2 mx-auto">
                            <IconRefresh /> {T(lang, "再來一次", "Try Again")}
                        </button>
                    </div>
                );
            }

            return (
                <div className="w-full">
                    {/* Progress Bar */}
                    <div className="flex justify-between items-center mb-4 text-sm font-bold text-slate-500">
                        <span>{T(lang, "訓練進度", "Progress")}: {qIndex + 1} / {questions.length}</span>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-6">
                        <h3 className="text-lg sm:text-xl font-bold text-slate-800 mb-4" dangerouslySetInnerHTML={{__html: currentQ.title}} />
                        
                        {/* Short Division Diagram if exists */}
                        {currentQ.shortDivision && <ShortDivisionDiagram data={currentQ.shortDivision} stepStatus={stepStatus} lang={lang} />}

                        {/* 推導解題 (Derivation Area) */}
                        <div className="bg-indigo-50/40 border border-indigo-200 p-4 sm:p-5 rounded-xl mb-6 shadow-sm">
                            <h4 className="font-bold text-indigo-900 mb-3 flex items-center gap-2">
                                <IconLightbulb />
                                {T(lang, "推導解題", "Derivation Steps")}
                            </h4>
                            <div className="font-mono text-base sm:text-lg text-slate-800 space-y-2 pl-3 border-l-4 border-indigo-500 bg-white p-4 rounded-lg shadow-inner min-h-[60px]">
                                {currentQ.steps.map((step, sIdx) => {
                                    const status = stepStatus[sIdx];
                                    if (status?.completed) {
                                        return (
                                            <div key={sIdx} className="animate-fade-in flex items-start gap-3">
                                                <span className="text-indigo-400 font-bold select-none pt-0.5 w-4 text-center">{isExprManipulation ? "=" : "↳"}</span>
                                                <span className="flex-1" dangerouslySetInnerHTML={{__html: step.correct}} />
                                            </div>
                                        );
                                    }
                                    return null;
                                })}
                                {!allStepsCompleted && (
                                    <div className="animate-pulse text-indigo-400 font-bold flex items-start gap-3">
                                        <span className="text-indigo-300 select-none pt-0.5 w-4 text-center">{isExprManipulation ? "=" : "↳"}</span>_
                                    </div>
                                )}
                                {allStepsCompleted && (
                                    <div className="mt-2 pt-2 border-t border-slate-100 flex items-center gap-2 text-emerald-600 text-sm font-sans font-bold animate-fade-in">
                                        <IconCheck /> {T(lang, "解題完成！", "Derivation Complete!")}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Steps Quiz Area */}
                        <div className="space-y-3">
                            {currentQ.steps.map((step, sIdx) => {
                                const status = stepStatus[sIdx];
                                const isActive = sIdx === currentActiveStep;
                                const isCompleted = status?.completed;
                                const isFailed = status?.isCorrect === false && status?.completed;

                                if (!isActive && !isCompleted) return null;

                                if (isCompleted) {
                                    // 縮小已完成的步驟
                                    return (
                                        <div key={sIdx} className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2 text-sm text-slate-600 bg-slate-100/50 p-3 rounded-lg border border-slate-200 transition-all opacity-80 hover:opacity-100">
                                            <div className="flex items-start gap-2 flex-1">
                                                <div className="mt-0.5">{isFailed ? <IconCross /> : <IconCheck />}</div>
                                                <div>
                                                    <span className="font-bold text-slate-700 mr-2">{T(lang, "步驟", "Step")} {sIdx + 1}:</span>
                                                    <span dangerouslySetInnerHTML={{__html: step.prompt}} />
                                                </div>
                                            </div>
                                            <div className="font-mono font-bold text-indigo-700 bg-white px-3 py-1 rounded border border-indigo-100 shadow-sm" dangerouslySetInnerHTML={{__html: step.correct}} />
                                        </div>
                                    );
                                }

                                return (
                                    <div key={sIdx} className="bg-indigo-50/50 border-2 border-indigo-400 p-4 sm:p-5 rounded-xl shadow-md animate-fade-in">
                                        <div className="flex justify-between items-start mb-3">
                                            <h4 className="font-bold text-slate-800 text-sm sm:text-base" dangerouslySetInnerHTML={{__html: step.prompt}} />
                                            <div className="text-xs font-bold text-indigo-500 bg-indigo-100 px-2 py-1 rounded-md">
                                                {T(lang, "剩餘機會:", "Attempts:")} {attemptsLeft[sIdx]}
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
                                            {step.options.map((opt, oIdx) => {
                                                const isSelected = status?.selectedOption === opt;
                                                const isWrong = isSelected && status?.isCorrect === false;
                                                
                                                let btnClass = "text-left p-3 rounded-lg border-2 text-sm font-mono transition-all ";
                                                if (isWrong) {
                                                    btnClass += "border-rose-400 bg-rose-50 text-rose-700 opacity-50 cursor-not-allowed";
                                                } else {
                                                    btnClass += "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 text-slate-700";
                                                }

                                                return (
                                                    <button 
                                                        key={oIdx} 
                                                        disabled={isWrong || isCompleted}
                                                        onClick={() => handleSelectOption(sIdx, opt)}
                                                        className={btnClass}
                                                        dangerouslySetInnerHTML={{__html: opt}}
                                                    />
                                                );
                                            })}
                                        </div>

                                        {status?.selectedOption && status.isCorrect === false && !isCompleted && (
                                            <div className="mt-3 text-sm text-rose-600 font-bold flex items-center gap-1 animate-fade-in">
                                                <IconCross /> {T(lang, "不正確，請再試一次！", "Incorrect, try again!")}
                                            </div>
                                        )}

                                        {isCompleted && status.isCorrect && step.explanation && (
                                            <div className="mt-3 text-sm text-emerald-700 bg-emerald-50 p-2 rounded-md border border-emerald-200 animate-fade-in" dangerouslySetInnerHTML={{__html: step.explanation}} />
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {allStepsCompleted && (
                            <div className="mt-6 flex justify-end animate-fade-in">
                                <button onClick={nextQuestion} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-indigo-700 shadow-sm transition flex items-center gap-2">
                                    {qIndex < questions.length - 1 ? T(lang, "下一題", "Next Question") : T(lang, "完成小測", "Finish Quiz")}
                                    <IconArrowRight />
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [currentLesson, setCurrentLesson] = useState('LO'); // L0 is the default
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            const LESSON_SYLLABUS = getLessonSyllabus(lang);
            const activeLesson = LESSON_SYLLABUS.find(l => l.id === currentLesson) || LESSON_SYLLABUS[0];

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
                    {/* Mobile Header with Menu Icon on Top Left */}
                    <div className="md:hidden bg-indigo-600 text-white p-4 flex items-center justify-between shadow-md relative z-20">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-1 hover:bg-indigo-500 rounded transition-colors">
                                <IconMenu />
                            </button>
                            <h1 className="font-bold text-lg">{T(lang, "中二數學訓練", "F.2 Math")}</h1>
                        </div>
                        <button onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')} className="text-sm font-bold bg-indigo-500 px-3 py-1 rounded hover:bg-indigo-400 transition-colors">
                            {lang === 'zh' ? 'EN' : '中'}
                        </button>
                    </div>

                    {/* Sidebar Overlay */}
                    {isSidebarOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 z-30 md:hidden" onClick={() => setIsSidebarOpen(false)}></div>
                    )}

                    {/* Sidebar Navigation */}
                    <div className={`fixed md:sticky top-0 left-0 h-full w-72 bg-white shadow-xl md:shadow-md border-r border-slate-200 z-40 transition-transform duration-300 flex flex-col ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-5 border-b border-slate-100 hidden md:flex justify-between items-center bg-indigo-600 text-white">
                            <h1 className="font-bold text-xl">{T(lang, "數學訓練平台", "Math Trainer")}</h1>
                            <button onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')} className="text-sm font-bold bg-indigo-500 px-3 py-1 rounded hover:bg-indigo-400 transition-colors">
                                {lang === 'zh' ? 'EN' : '中'}
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 hide-scrollbar">
                            <div className="mb-4 text-xs font-bold text-slate-400 uppercase tracking-wider">{T(lang, "選擇單元", "Select Lesson")}</div>
                            <div className="space-y-1.5">
                                {LESSON_SYLLABUS.map(lesson => (
                                    <button 
                                        key={lesson.id}
                                        onClick={() => { setCurrentLesson(lesson.id); setIsSidebarOpen(false); }}
                                        className={`w-full text-left p-3 rounded-xl transition-all flex flex-col gap-1 ${currentLesson === lesson.id ? 'bg-indigo-50 border-indigo-200 border text-indigo-700 shadow-sm' : 'border border-transparent text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}
                                    >
                                        <span className="font-bold text-sm">{lesson.title}</span>
                                        <span className={`text-[10px] w-max px-1.5 py-0.5 rounded ${currentLesson === lesson.id ? 'bg-indigo-100 text-indigo-600' : 'bg-slate-100 text-slate-500'}`}>{lesson.category}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 overflow-y-auto h-screen relative scroll-smooth bg-slate-50/50">
                        <div className="max-w-4xl mx-auto p-4 sm:p-6 md:p-8 pb-20">
                            <div className="mb-6 sm:mb-8 bg-gradient-to-r from-indigo-800 to-indigo-600 rounded-2xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -translate-y-1/2 translate-x-1/3"></div>
                                <h2 className="text-2xl sm:text-3xl font-black mb-2 relative z-10">{activeLesson.title}</h2>
                                <p className="text-indigo-100 text-sm sm:text-base max-w-2xl relative z-10">{activeLesson.desc}</p>
                            </div>

                            <ConceptVisualizer lessonId={currentLesson} lang={lang} />
                            
                            <StepByStepQuizEngine key={currentLesson + lang} lessonId={currentLesson} lang={lang} />
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
